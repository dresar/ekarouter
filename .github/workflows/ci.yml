name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: true

      - name: Run Unit Tests
        run: go test -v -count=1 ./...

      - name: Build Standalone Executable
        run: go build -ldflags="-s -w" -o bin/ekarouter${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/ekarouter
